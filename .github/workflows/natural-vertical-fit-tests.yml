name: Natural Vertical Fit Foundation Tests
on:
  push:
    branches:
      - feature/natural-vertical-fit-foundation
    paths:
      - 'lib/naturalVerticalFit.mjs'
      - 'lib/capitalIntelligenceIntake.mjs'
      - 'tests/naturalVerticalFit.test.mjs'
      - 'tests/capitalIntelligenceIntake.test.mjs'
      - 'tests/capitalIntelligenceSchema.test.mjs'
      - 'tests/mubadalaResearchPilot.test.mjs'
      - 'tests/mubadalaInfrastructureResearch.test.mjs'
      - 'tests/mubadalaBatch20.test.mjs'
      - 'tests/mubadalaBatch02_20.test.mjs'
      - 'tests/mubadalaBatch03_20.test.mjs'
      - 'tests/mubadalaBatch04_50.test.mjs'
      - 'tests/mubadalaFinal25PifFirst25.test.mjs'
      - 'research/investee_snapshots/mubadala_final25_pif_first25_2026-11-15_UNREVIEWED.json'
      - 'research/investee_snapshots/mubadala_batch_04_50_2026-11-15_UNREVIEWED.json'
      - 'research/investee_snapshots/mubadala_batch_03_20_2026-11-15_UNREVIEWED.json'
      - 'research/investee_snapshots/mubadala_batch_02_20_2026-11-14_UNREVIEWED.json'
      - 'research/investee_snapshots/mubadala_batch_20_2026-11-14_UNREVIEWED.json'
      - 'tests/financialTemporalResearch.test.mjs'
      - 'research/investee_snapshots/mubadala_energy_infrastructure_followons_2026-11-14.json'
      - 'tests/strategyLifecycleSchema.test.mjs'
      - 'research/divestments/mubadala_coolit_2026-03-26_UNREVIEWED.json'
      - 'research/fund_evolution/mubadala_2022_2025_official_performance_UNREVIEWED.json'
      - 'supabase/capital_intelligence_strategy_lifecycle_private.sql'
      - 'research/investee_snapshots/mubadala_pilot_2026-11-14.json'
      - 'supabase/capital_intelligence_snapshots_private.sql'
      - '.github/workflows/natural-vertical-fit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
